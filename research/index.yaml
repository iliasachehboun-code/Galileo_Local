topic: Local Galileo (standalone)
updated: 2026-10-22
summary: >
  Plateforme locale d'observabilité et d'évaluation alignée sur la surface
  publique de Galileo : chat Agno, traces SQLite, métriques, expériences,
  console. Project galileo-local / stream chat. Luna Studio, Signals et
  l'assistant sont hors v1. Les spans de contenu sont workflow, agent, llm,
  retriever et tool.
